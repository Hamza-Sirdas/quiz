# QUIZORA Render Blueprint
# Not: Aktif yarışma odaları bellek içi (in-memory) yönetildiğinden Web Service tek instance olarak çalıştırılmalıdır.
# Çoklu instance gerekirse Socket.IO Redis Adapter eklenmelidir.

databases:
  - name: quizora-db
    plan: free
    databaseName: quizora
    user: quizora_user

services:
  - type: web
    name: quizora-api
    runtime: node
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: quizora-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
