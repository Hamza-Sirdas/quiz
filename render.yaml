# QUIZORA Render Blueprint
# Not: Aktif yarışma odaları bellek içi (in-memory) yönetildiğinden Web Service tek instance olarak çalıştırılmalıdır.
# Veritabanı olarak Neon PostgreSQL (DATABASE_URL) kullanılır.

services:
  - type: web
    name: quizora-api
    runtime: node
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://quizora-five-jet.vercel.app
      - key: COOKIE_SAME_SITE
        value: none
      - key: GEMINI_API_KEY
        sync: false
